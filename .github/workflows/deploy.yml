name: Build and deploy BMW Collection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npm run build -- --configuration production --base-href /design-2/

      - name: Create SPA fallback
        run: cp dist/bmw-collection/browser/index.html dist/bmw-collection/browser/404.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bmw-collection/browser

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
